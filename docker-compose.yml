version: '3.8'

services:
  # ============================================================================
  # MySQL Database
  # ============================================================================
  mysql:
    image: mysql:8.0-alpine
    container_name: sistem_ppi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sistem_ppi_rs}
      MYSQL_USER: ${DB_USER:-ppi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ppi_password_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_123}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ppi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-ppi_user}", "-p${DB_PASSWORD:-ppi_password_123}"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ============================================================================
  # Next.js Application
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistem_ppi_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${DB_USER:-ppi_user}:${DB_PASSWORD:-ppi_password_123}@mysql:3306/${DB_NAME:-sistem_ppi_rs}"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key-here-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-here-change-in-production}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
    networks:
      - ppi_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      timeout: 10s
      retries: 5
      interval: 30s

  # ============================================================================
  # phpMyAdmin (Optional - for database management)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sistem_ppi_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-ppi_user}
      PMA_PASSWORD: ${DB_PASSWORD:-ppi_password_123}
      PMA_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_123}
    ports:
      - "8080:80"
    networks:
      - ppi_network

volumes:
  mysql_data:
    driver: local

networks:
  ppi_network:
    driver: bridge
